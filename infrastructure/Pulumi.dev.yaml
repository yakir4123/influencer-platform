# Dev environment configuration for Influencer Platform backend infrastructure
config:
  # Google Cloud Settings
  gcp:project: project-35d3eed2-c73d-4ab5-998
  gcp:region: europe-west1
  # Resource Names
  influencer-platform:storage_bucket_name: your-influencer-platform-images-bucket
  influencer-platform:artifact_registry_repo_name: influencer-platform-repo
  # Cloud Run Performance Tuning (Optional, defaults will be used if omitted)
  influencer-platform:cloud_run_service_name: influencer-platform-backend
  influencer-platform:cloud_run_max_instances: "5"
  influencer-platform:cloud_run_memory: 512Mi
  influencer-platform:cloud_run_cpu: "1"
